# LinuxDevOps Academy — конфигурация nginx для платформы

server {
    listen 80;
    server_name _;

    charset utf-8;
    client_max_body_size 2m;

    # ---------- статистику отдаёт сам nginx ----------
    location /static/ {
        alias /workspace/app/static/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # ---------- остальное — Flask (gunicorn, unix-сокет) ----------
    location / {
        proxy_pass http://unix:/tmp/platform.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1k;
}
